[package]
name = "nasiko"
edition.workspace = true
version.workspace = true

[lib]
name = "nasiko"
path = "src/lib.rs"

[[bin]]
name = "nasiko"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
ureq.workspace = true
dialoguer.workspace = true
indicatif.workspace = true
dirs.workspace = true
sha2.workspace = true
hex.workspace = true
tar.workspace = true
flate2.workspace = true
which.workspace = true
include_dir.workspace = true
base64.workspace = true
uuid.workspace = true
nasiko-types.workspace = true
nasiko-utils.workspace = true
ratatui.workspace = true
crossterm.workspace = true
chrono.workspace = true
tabled.workspace = true
zip.workspace = true
# Not `[target.'cfg(unix)'.dependencies]`: scripts/gen-oss-cargo-toml only scans plain
# dependency tables for `workspace = true` usage (see its `collect_used_workspace_deps`), so a
# target-gated table here would always get pruned from oss/Cargo.toml, breaking the OSS
# standalone build. `libc` itself builds fine on every platform; the actual Unix-only signal
# code that uses it is gated with `#[cfg(unix)]` in hitl.rs, not here.
libc.workspace = true

[dev-dependencies]
mockito.workspace = true
tempfile.workspace = true
