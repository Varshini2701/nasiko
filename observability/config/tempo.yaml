stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 30s   # flush quickly for local dev

compactor:
  compaction:
    block_retention: 744h   # 31 days — covers the 30d TokenOps filter

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
      ingestion_time_range_slack: 360h   # allow backfilled traces up to 15 days old
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false