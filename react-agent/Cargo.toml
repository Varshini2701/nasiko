[package]
name = "nasiko-react-agent"
version.workspace = true
edition.workspace = true

[dependencies]
# LLM orchestration
rig-core = { workspace = true }
nasiko-llm-router = { workspace = true }
async-stream = { workspace = true }

# Async & streaming
tokio = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP client (for A2A calls)
reqwest = { workspace = true }

# A2A wire-shape helpers (SSE event classification, text extraction)
nasiko-types = { workspace = true }

# Structural compression of stored tool results (IP-3)
nasiko-compress = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing-subscriber = { workspace = true }
# src/tool.rs's tests stand up a mockito server for the A2A HTTP calls. This
# line was dropped by the [oss-import] replay in f8dc3472 (the public repo's
# copy of this manifest never had it) while the tests that need it stayed —
# `cargo test -p nasiko-react-agent --lib` has not compiled since.
mockito = { workspace = true }

[[example]]
name = "test_tools"
path = "examples/test_tools.rs"
