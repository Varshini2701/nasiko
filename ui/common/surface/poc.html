<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nasiko — Dynamic Dashboards</title>
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="../components.css" />
    <!-- All 24 "ready" design-system components (ui/common/surface/dsl-overrides.json). -->
    <script type="module" src="../design-system/app-action-menu/app-action-menu.js"></script>
    <script type="module" src="../design-system/app-badge/app-badge.js"></script>
    <script type="module" src="../design-system/app-button/app-button.js"></script>
    <script type="module" src="../design-system/app-card/app-card.js"></script>
    <script type="module" src="../design-system/app-chart/app-chart.js"></script>
    <script type="module" src="../design-system/app-chatbox/app-chatbox.js"></script>
    <script type="module" src="../design-system/app-checkbox/app-checkbox.js"></script>
    <script type="module" src="../design-system/app-code-snippet/app-code-snippet.js"></script>
    <script type="module" src="../design-system/app-divider/app-divider.js"></script>
    <script type="module" src="../design-system/app-empty-state/app-empty-state.js"></script>

    <style>
      /* Self-contained light theme for this page's own chrome (chat/preview
         shell) — global.css/components.css are still loaded for the real
         design-system components' own internal tokens, but this page never
         sets up the surrounding app-shell context those files assume, so
         every chrome color here is explicit. */
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #ffffff; color: #14161a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }

      .app { display: flex; flex-direction: column; height: 100vh; }

      /* ── Top bar ─────────────────────────────────────────────────────── */
      .topbar {
        flex: 0 0 auto; height: 52px; display: flex; align-items: center;
        justify-content: space-between; padding: 0 18px;
        border-bottom: 1px solid #e6e8eb; background: #fff; position: relative; z-index: 20;
      }
      .topbar-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: #14161a; }
      .topbar-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #4f6df5; }
      .topbar-right { display: flex; align-items: center; gap: 10px; }
      .session-pill {
        font-size: 12px; color: #5a616e; font-family: ui-monospace, monospace;
        background: #f4f5f7; border-radius: 6px; padding: 4px 8px;
      }
      .icon-btn {
        border: 1px solid #dfe2e7; background: #fff; color: #3c4149;
        border-radius: 7px; padding: 6px 11px; font-size: 12.5px; font-weight: 500;
        cursor: pointer;
      }
      .icon-btn:hover { background: #f5f6f8; }

      .settings-panel {
        position: absolute; top: 52px; right: 18px; width: 300px;
        background: #fff; border: 1px solid #e1e4e9; border-radius: 10px;
        box-shadow: 0 8px 24px rgba(20, 22, 26, 0.12); padding: 14px; display: none; z-index: 30;
      }
      .settings-panel.open { display: block; }
      .settings-panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: #7a828e; margin: 0 0 10px; }
      .settings-field { margin-bottom: 10px; }
      .settings-field label { display: block; font-size: 12px; color: #5a616e; margin-bottom: 4px; }
      .settings-field input {
        width: 100%; border: 1px solid #d3d7dd; border-radius: 6px; padding: 7px 9px;
        font-size: 13px; background: #fff; color: #14161a;
      }
      .settings-status { font-size: 12px; color: #5a616e; margin-top: 6px; }

      /* ── Main split ──────────────────────────────────────────────────── */
      .main { flex: 1 1 auto; display: flex; overflow: hidden; min-height: 0; }

      .preview-pane { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; background: #fafbfc; }
      .preview-header {
        flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
        padding: 12px 20px; border-bottom: 1px solid #eceef1; background: #fff;
      }
      .preview-header .title { font-size: 13px; font-weight: 600; color: #3c4149; }
      .preview-header .hint { font-size: 12px; color: #9aa1ab; }
      .preview-body { flex: 1 1 auto; overflow: auto; padding: 28px; transition: opacity 0.2s ease; }
      .preview-empty {
        height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #9aa1ab; gap: 8px; text-align: center;
      }
      .preview-empty .big { font-size: 15px; font-weight: 600; color: #5a616e; }
      .preview-empty .small { font-size: 13px; max-width: 360px; }

      /* ── Chat sidebar (right) ────────────────────────────────────────── */
      .chat-sidebar {
        flex: 0 0 420px; display: flex; flex-direction: column;
        border-left: 1px solid #e6e8eb; background: #fff; min-height: 0;
      }
      .chat-header {
        flex: 0 0 auto; padding: 14px 18px; border-bottom: 1px solid #eceef1;
        font-size: 13.5px; font-weight: 600; color: #14161a;
      }
      .chat-messages { flex: 1 1 auto; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }

      .msg-user { align-self: flex-end; max-width: 88%; }
      .msg-user .bubble {
        background: #eef1fb; color: #1f2a44; border-radius: 12px 12px 3px 12px;
        padding: 10px 13px; font-size: 13.5px; line-height: 1.5;
      }
      .msg-assistant { align-self: stretch; max-width: 100%; }
      .msg-assistant .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .msg-assistant .status-pill {
        font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
        background: #eef1fb; color: #3a56c9;
      }
      .msg-assistant .status-pill.done { background: #e8f7ee; color: #1e7d40; }
      .msg-assistant .status-pill.error { background: #fdecec; color: #b3261e; }
      .msg-assistant .elapsed { font-size: 11.5px; color: #9aa1ab; font-family: ui-monospace, monospace; }
      .msg-assistant .text { font-size: 13.5px; line-height: 1.55; color: #2b2f36; white-space: pre-wrap; }

      .code-toggle {
        margin-top: 8px; display: inline-flex; align-items: center; gap: 6px;
        font-size: 12px; color: #4f6df5; cursor: pointer; user-select: none; font-weight: 500;
      }
      .code-toggle:hover { text-decoration: underline; }
      .code-block {
        margin-top: 8px; background: #14161a; color: #d7dae0; border-radius: 8px;
        font: 11.5px/1.55 ui-monospace, "SF Mono", Menlo, monospace; padding: 10px 12px;
        max-height: 240px; overflow: auto; white-space: pre-wrap; display: none;
      }
      .code-block.open { display: block; }

      .chat-input-row {
        flex: 0 0 auto; padding: 12px 14px; border-top: 1px solid #eceef1;
        display: flex; gap: 8px; align-items: flex-end; background: #fff;
      }
      .chat-input-row textarea {
        flex: 1 1 auto; resize: none; border: 1px solid #d3d7dd; border-radius: 10px;
        padding: 10px 12px; font-size: 13.5px; font-family: inherit; color: #14161a;
        min-height: 40px; max-height: 120px; line-height: 1.4;
      }
      .chat-input-row textarea:focus { outline: none; border-color: #4f6df5; box-shadow: 0 0 0 3px rgba(79, 109, 245, 0.14); }
      .send-btn {
        flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; border: none;
        background: #4f6df5; color: #fff; font-size: 15px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
      }
      .send-btn:hover { background: #3d5adf; }
      .send-btn:disabled { background: #c6cbf0; cursor: not-allowed; }

      .suggestions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 12px; }
      .suggestion-chip {
        font-size: 12px; color: #3c4149; background: #f4f5f7; border: 1px solid #e6e8eb;
        border-radius: 999px; padding: 6px 12px; cursor: pointer;
      }
      .suggestion-chip:hover { background: #eceef1; }

      .spinner {
        width: 12px; height: 12px; border-radius: 50%;
        border: 2px solid #c6cbf0; border-top-color: #4f6df5;
        animation: spin 0.7s linear infinite; display: inline-block;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="topbar-brand"><span class="dot"></span> Nasiko Dynamic Dashboards</div>
        <div class="topbar-right">
          <span class="session-pill" id="session-status">not logged in</span>
          <button class="icon-btn" id="settings-toggle">Settings</button>
        </div>
        <div class="settings-panel" id="settings-panel">
          <h3>Session (local dev only)</h3>
          <div class="settings-field">
            <label>WEAVE_INTERNAL_TOKEN</label>
            <input id="internal-token" type="password" placeholder="paste WEAVE_INTERNAL_TOKEN" />
          </div>
          <div class="settings-field">
            <label>Username</label>
            <input id="login-username" type="text" placeholder="admin" />
          </div>
          <div class="settings-field">
            <label>Password</label>
            <input id="login-password" type="password" placeholder="password" />
          </div>
          <button class="icon-btn" id="do-login" style="width:100%;">Log in</button>
          <div class="settings-status" id="login-status"></div>
        </div>
      </div>

      <div class="main">
        <div class="preview-pane">
          <div class="preview-header">
            <span class="title">Live preview</span>
            <span class="hint" id="preview-hint">Nothing generated yet</span>
          </div>
          <div class="preview-body" id="preview-body">
            <div class="preview-empty" id="preview-empty">
              <div class="big">Describe the dashboard you want</div>
              <div class="small">Type a request in the chat on the right — the dashboard will build itself here, live, as it streams.</div>
            </div>
          </div>
        </div>

        <div class="chat-sidebar">
          <div class="chat-header">Conversation</div>
          <div class="chat-messages" id="chat-messages"></div>
          <div class="suggestions">
            <span class="suggestion-chip" data-prompt="build me a simple spend dashboard">Spend dashboard</span>
            <span class="suggestion-chip" data-prompt="show me a table of daily usage over the last 2 weeks">Usage table</span>
            <span class="suggestion-chip" data-prompt="add a way to toggle between showing total cost and showing request count">Toggle KPI</span>
          </div>
          <div class="chat-input-row">
            <textarea id="chat-input" placeholder="Describe or revise the dashboard…" rows="1"></textarea>
            <button class="send-btn" id="send-btn" title="Send">➤</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { parseBuffer } from './parser.js';
      import { materialize, buildComponentIndex, buildEvalContext, evaluateExpr } from './materialize.js';
      import { render } from './render.js';
      import { resolvePendingQueries, fireMutation, triggerAction } from './query-manager.js';
      import { createStore } from './store.js';
      import { pruneUnreachable, unreachableStatements } from './gc.js';
      import { call } from '../core/data-sources.js';

      const catalog = await (await fetch('./dsl-catalog.json')).json();
      const componentIndex = buildComponentIndex(catalog);

      const previewBody = document.getElementById('preview-body');
      const previewEmpty = document.getElementById('preview-empty');
      const previewHint = document.getElementById('preview-hint');
      const chatMessages = document.getElementById('chat-messages');
      const chatInput = document.getElementById('chat-input');
      const sendBtn = document.getElementById('send-btn');

      let previewRootEl = null;
      function ensurePreviewRoot() {
        if (previewRootEl) return previewRootEl;
        previewEmpty.remove();
        previewRootEl = document.createElement('div');
        previewBody.appendChild(previewRootEl);
        return previewRootEl;
      }

      // ─── Settings panel (login + internal token) ───────────────────────
      const settingsPanel = document.getElementById('settings-panel');
      document.getElementById('settings-toggle').addEventListener('click', () => {
        settingsPanel.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!settingsPanel.contains(e.target) && e.target.id !== 'settings-toggle') {
          settingsPanel.classList.remove('open');
        }
      });

      const sessionStatus = document.getElementById('session-status');
      document.getElementById('do-login').addEventListener('click', async () => {
        const username = document.getElementById('login-username').value || 'admin';
        const password = document.getElementById('login-password').value;
        const statusEl = document.getElementById('login-status');
        statusEl.textContent = 'logging in…';
        try {
          const resp = await fetch(`${window.nasikoConfig?.apiBase || ''}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ username, password }),
          });
          if (resp.ok) {
            statusEl.textContent = 'logged in';
            sessionStatus.textContent = `logged in as ${username}`;
            settingsPanel.classList.remove('open');
          } else {
            statusEl.textContent = `login failed: HTTP ${resp.status}`;
          }
        } catch (err) {
          statusEl.textContent = `login error: ${err}`;
        }
      });

      // ─── Reactive/session state — persists across the whole conversation ─
      const store = createStore();
      // A bare @Set/@Reset action (no accompanying @Run) has NO other way to
      // reach the screen — triggerAction's 'set'/'reset' steps only write to
      // the store, they never call renderPreview themselves. Without this
      // subscription, clicking a plain toggle button silently updates state
      // with zero visible effect. renderPreview is a plain function
      // declaration below, so it's hoisted and safe to reference here.
      store.subscribe(() => renderPreview());
      const queryCache = new Map();
      const queryInFlight = new Set();
      const queryFailures = new Map(); // statementId -> attempt count, see query-manager.js
      const mutationResults = new Map();
      let currentSurfaceText = '';
      let buffer = '';
      let assistantBusy = false;

      function isAnyLoading() {
        if (queryInFlight.size > 0) return true;
        for (const m of mutationResults.values()) if (m.status === 'loading') return true;
        return false;
      }

      async function toolProvider(toolName, args) {
        return call(toolName, ...args);
      }

      // A real DSL statement always starts `name = ` or `$name = ` — anything
      // else is the model's own plain-English wrapping text (agent.yaml's
      // rule 12: one friendly line before the DSL, one after). No backend
      // marker needed: our parser already treats any non-matching line as
      // ignorable, so this is just the client picking out the SAME lines to
      // display as real chat text instead of leaving them buried in the
      // collapsed code block. The last line is always dropped — it may
      // still be mid-stream — and gets picked up whole once its newline
      // arrives on a later chunk.
      const DSL_STATEMENT_START = /^\s*\$?[a-zA-Z_]\w*\s*=/;
      function extractProseText(fullText) {
        const lines = fullText.split('\n').slice(0, -1);
        return lines.filter((l) => l.trim() && !DSL_STATEMENT_START.test(l)).join('\n');
      }

      // render() does a full clear-and-rebuild on every pass (no reconciler —
      // a deliberate, documented simplification). That was invisible for
      // text input as long as typing never triggered a real re-render (the
      // $event fix changes that: a keystroke now genuinely changes state).
      // Confirmed live: typing a single character into a real search box
      // lost focus entirely (`document.activeElement` fell back to `<body>`)
      // because the rebuild replaces the `<input>` node outright. This
      // captures which element had focus (by child-index path, since the
      // rebuilt tree has the same shape when only data changed) and its
      // cursor position, and restores both on the new element after render.
      function capturePathTo(root, el) {
        const path = [];
        let node = el;
        while (node && node !== root) {
          const parent = node.parentElement;
          if (!parent) return null;
          path.unshift(Array.prototype.indexOf.call(parent.children, node));
          node = parent;
        }
        return node === root ? path : null;
      }
      function resolvePath(root, path) {
        let node = root;
        for (const idx of path) {
          node = node?.children?.[idx];
          if (!node) return null;
        }
        return node;
      }

      function renderPreview() {
        previewBody.style.opacity = isAnyLoading() ? '0.65' : '1';
        const { statements } = parseBuffer(buffer);
        const { root, unresolved, queries, mutationDefs, errors } = materialize(
          statements, componentIndex, queryCache, mutationResults, store,
        );
        const container = ensurePreviewRoot();
        const active = document.activeElement;
        const focused = active && container.contains(active) ? active : null;
        const focusPath = focused ? capturePathTo(container, focused) : null;
        const selStart = focused && 'selectionStart' in focused ? focused.selectionStart : null;
        const selEnd = focused && 'selectionEnd' in focused ? focused.selectionEnd : null;

        render(root, container, catalog, {
          triggerAction: (action, evalCtx, deps) => triggerAction(action, evalCtx, deps),
          evalCtx: () => buildEvalContext(statements, componentIndex, queryCache, mutationResults, store),
          deps: () => ({
            evaluate: evaluateExpr,
            mutationDefs,
            mutationResults,
            toolProvider,
            invalidateQueries: (ids) => {
              for (const id of ids) { queryCache.delete(id); queryFailures.delete(id); }
              renderPreview();
            },
            store,
            onSettled: renderPreview,
            sendToAssistant: (message) => sendPrompt(message, { synthetic: true }),
            isAssistantBusy: () => assistantBusy,
            openUrlAllowlist: undefined, // closed by default — no real route allowlist exists yet
          }),
          onError: (errs) => { if (errs.length) console.warn('surface errors:', errs); },
        });
        if (focusPath) {
          const newFocused = resolvePath(container, focusPath);
          if (newFocused && typeof newFocused.focus === 'function') {
            newFocused.focus();
            if (selStart !== null && typeof newFocused.setSelectionRange === 'function') {
              try { newFocused.setSelectionRange(selStart, selEnd); } catch { /* not a text-selectable input */ }
            }
          }
        }
        if (errors.length) console.warn('materializer errors:', errors);
        previewHint.textContent = unresolved.length ? `waiting on: ${unresolved.join(', ')}` : 'up to date';
        resolvePendingQueries(queries, queryCache, queryInFlight, toolProvider, renderPreview, queryFailures);
      }

      // ─── Chat transcript UI ─────────────────────────────────────────────
      function addUserMessage(text) {
        const el = document.createElement('div');
        el.className = 'msg-user';
        el.innerHTML = `<div class="bubble"></div>`;
        el.querySelector('.bubble').textContent = text;
        chatMessages.appendChild(el);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function addAssistantMessage() {
        const el = document.createElement('div');
        el.className = 'msg-assistant';
        el.innerHTML = `
          <div class="status-row">
            <span class="spinner"></span>
            <span class="status-pill">Generating</span>
            <span class="elapsed"></span>
          </div>
          <div class="text"></div>
          <span class="code-toggle">▸ View DSL</span>
          <div class="code-block"></div>
        `;
        chatMessages.appendChild(el);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        const codeToggle = el.querySelector('.code-toggle');
        const codeBlock = el.querySelector('.code-block');
        codeToggle.addEventListener('click', () => {
          codeBlock.classList.toggle('open');
          codeToggle.textContent = (codeBlock.classList.contains('open') ? '▾' : '▸') + ' View DSL';
        });

        const startedAt = performance.now();
        return {
          setCode(text) {
            codeBlock.textContent = text;
            if (codeBlock.classList.contains('open')) chatMessages.scrollTop = chatMessages.scrollHeight;
          },
          setText(text) { el.querySelector('.text').textContent = text; },
          setDone(componentCount) {
            el.querySelector('.spinner').remove();
            const pill = el.querySelector('.status-pill');
            pill.textContent = 'Done';
            pill.classList.add('done');
            el.querySelector('.elapsed').textContent = `${((performance.now() - startedAt) / 1000).toFixed(1)}s`;
            if (!el.querySelector('.text').textContent) {
              el.querySelector('.text').textContent = componentCount
                ? `Updated the dashboard (${componentCount} statement${componentCount === 1 ? '' : 's'}).`
                : 'Done.';
            }
          },
          setError(message) {
            el.querySelector('.spinner')?.remove();
            const pill = el.querySelector('.status-pill');
            pill.textContent = 'Error';
            pill.classList.remove('done');
            pill.classList.add('error');
            el.querySelector('.text').textContent = message;
          },
        };
      }

      /** Manual SSE reader — POST + streaming body, since native EventSource
       * only supports GET. Splits on blank-line-delimited event blocks. */
      async function* readSse(response) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) !== -1) {
            const block = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            const eventLine = block.split('\n').find((l) => l.startsWith('event: '));
            const dataLine = block.split('\n').find((l) => l.startsWith('data: '));
            if (eventLine && dataLine) {
              yield { event: eventLine.slice(7), data: JSON.parse(dataLine.slice(6)) };
            }
          }
        }
      }

      async function sendPrompt(prompt, { synthetic = false } = {}) {
        if (assistantBusy) return;
        assistantBusy = true;
        sendBtn.disabled = true;
        if (!synthetic) addUserMessage(prompt);
        const assistantMsg = addAssistantMessage();

        const token = document.getElementById('internal-token').value;
        let response;
        try {
          response = await fetch('http://localhost:8801/api/weave/surface', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-weave-internal-token': token },
            body: JSON.stringify({ prompt, context: { currentSurface: currentSurfaceText || undefined } }),
          });
        } catch (err) {
          assistantMsg.setError(`Could not reach the backend: ${err}`);
          assistantBusy = false;
          sendBtn.disabled = false;
          return;
        }
        if (!response.ok) {
          assistantMsg.setError(`Backend returned HTTP ${response.status} — check your internal token in Settings.`);
          assistantBusy = false;
          sendBtn.disabled = false;
          return;
        }

        const preTurnText = currentSurfaceText;
        buffer = currentSurfaceText;
        let sawFail = false;
        for await (const { event, data } of readSse(response)) {
          if (event === 'dsl-chunk') {
            buffer += data.text;
            assistantMsg.setCode(buffer);
            assistantMsg.setText(extractProseText(buffer));
            renderPreview();
            continue;
          }
          if (event === 'end') {
            // Detect >1 `root =` line within THIS turn's own streamed text
            // only (never across turns — a revision turn legitimately
            // re-emits root every time, that's how revision works at all).
            // Confirmed live: the model can emit an early "starter" root and
            // a later "final" root in the same response; same-name-overwrite
            // then silently drops anything only reachable via the first one
            // (e.g. a modal), with zero visible error.
            const thisTurnText = buffer.slice(preTurnText.length);
            const rootCount = (thisTurnText.match(/^\s*root\s*=/gm) || []).length;
            if (rootCount > 1) {
              console.warn(
                `surface: this turn emitted ${rootCount} "root =" statements — only the LAST one ` +
                  'takes effect; anything only reachable from an earlier root is now permanently ' +
                  'unreachable and will not render.',
              );
            }
            // A component the model defined but never wired into any
            // children array fails with zero visible error — it's simply
            // absent from the render, indistinguishable from "chose not to
            // build it". Confirmed live: a modal-opening button omitted
            // from root's tree while everything else rendered normally.
            const orphaned = unreachableStatements(buffer).filter((id) => !id.startsWith('$'));
            if (orphaned.length) {
              console.warn(
                `surface: ${orphaned.length} statement(s) defined but not reachable from root — ` +
                  `they will never render: ${orphaned.join(', ')}`,
              );
            }
            currentSurfaceText = pruneUnreachable(buffer, store);
            const { statements } = parseBuffer(currentSurfaceText);
            // One final pass over the FULL buffer (not the last completed
            // line's worth) — picks up a trailing closing sentence that
            // never got a chance to be followed by another newline.
            assistantMsg.setText(extractProseText(buffer + '\n'));
            assistantMsg.setDone(statements.length);
            continue;
          }
          if (event === 'fail') {
            sawFail = true;
            assistantMsg.setError(`${data.code}: ${data.message}`);
            continue;
          }
        }
        if (!sawFail && !buffer.trim()) {
          // Model answered in plain text (not a dashboard request) — nothing
          // to render; the assistant bubble's own text area already showed
          // whatever came through as dsl-chunks above would be empty in
          // that case since dsl_boundary only forwards recognized DSL lines.
          assistantMsg.setDone(0);
        }
        assistantBusy = false;
        sendBtn.disabled = false;
      }

      sendBtn.addEventListener('click', () => {
        const text = chatInput.value.trim();
        if (!text) return;
        chatInput.value = '';
        chatInput.style.height = 'auto';
        sendPrompt(text);
      });
      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendBtn.click();
        }
      });
      chatInput.addEventListener('input', () => {
        chatInput.style.height = 'auto';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
      });
      document.querySelectorAll('.suggestion-chip').forEach((chip) => {
        chip.addEventListener('click', () => sendPrompt(chip.dataset.prompt));
      });
    </script>
  </body>
</html>
